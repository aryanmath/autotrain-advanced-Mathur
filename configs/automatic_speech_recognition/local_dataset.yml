task: automatic_speech_recognition
base_model: facebook/wav2vec2-base-960h
project_name: autotrain-asr-finetuned
log: tensorboard
backend: local

data:
  path: data/ # this must be the path to the directory containing the train and valid files
  train_split: train # this must be either train.csv or train.json
  valid_split: valid # this must be either valid.csv or valid.json
  column_mapping:
    audio_column: audio # this must be the name of the column containing the audio file path
    text_column: text # this must be the name of the column containing the transcription

params:
  max_duration: 30.0 # maximum audio duration in seconds
  sampling_rate: 16000 # audio sampling rate
  epochs: 3
  batch_size: 4
  lr: 1e-4
  optimizer: adamw_torch
  scheduler: linear
  gradient_accumulation: 1
  mixed_precision: fp16
  max_grad_norm: 1.0
  weight_decay: 0.01
  warmup_ratio: 0.1
  early_stopping_patience: 3
  early_stopping_threshold: 0.01

hub:
  username: ${HF_USERNAME}
  token: ${HF_TOKEN}
  push_to_hub: true